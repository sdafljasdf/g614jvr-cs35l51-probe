name: G614JVR probe (guarded)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 7af1933c27aefcbdf4809ee44478829aad30f9c1
          path: MacKernelSDK
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: e4748cc081bf060302c7d3c44a643ce1d11b7e1d
          path: Lilu
      - name: Test isolated sequence
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror Research/G614JVR/ProbeSequenceTest.cpp -o "$RUNNER_TEMP/probe-test"
          "$RUNNER_TEMP/probe-test"
          clang++ -std=c++17 -Wall -Wextra -Werror Research/G614JVR/ChipSelectPolicyTest.cpp -o "$RUNNER_TEMP/cs-policy-test"
          "$RUNNER_TEMP/cs-policy-test"
          node --test Research/G614JVR/family_probe_policy.test.mjs
          python3 Tests/Transport/check_intel_spi.py
          python3 Tests/Transport/check_spi_gpio.py
          python3 Tests/Probe/check_power_lifecycle.py
          python3 Tests/Probe/check_deadline_counterexamples.py
          python3 Tests/Probe/check_passive_entry.py
          python3 Tests/Probe/check_gpi0_decoder.py
          python3 Tests/Probe/check_gpi0_observer_static.py
          clang++ -std=c++17 -Wall -Wextra -Werror -I. Tests/Probe/gpi0_observer_test.cpp -o "$RUNNER_TEMP/gpi0-observer-test"
          "$RUNNER_TEMP/gpi0-observer-test"
          clang -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=12.0 -arch x86_64 -I. \
            Tools/GPI0Observer/gpi0_observer.c -framework CoreFoundation -framework IOKit -o "$RUNNER_TEMP/gpi0-observer-client"
          lipo "$RUNNER_TEMP/gpi0-observer-client" -verify_arch x86_64
      - name: Compile dedicated probe target (unpublished candidate)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project G614JVRProbe.xcodeproj -target G614JVRProbe -configuration Debug \
            -sdk macosx ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Probe" build 2>&1 | tee "$RUNNER_TEMP/probe-build.log"
          BUNDLE="$GITHUB_WORKSPACE/build/Probe/G614JVRProbe.kext"
          plutil -lint "$BUNDLE/Contents/Info.plist"
          lipo "$BUNDLE/Contents/MacOS/G614JVRProbe" -verify_arch x86_64
          python3 Tools/Build/verify_kext_vtables.py "$BUNDLE/Contents/MacOS/G614JVRProbe"
          if nm "$BUNDLE/Contents/MacOS/G614JVRProbe" | grep -E 'CirrusAudioFixup|CS35L41Driver|bringUpAmplifiers|FirmwareBundle'; then
            echo 'Normal amplifier lifecycle symbols found in dedicated probe; fail closed.'
            exit 1
          fi
      - name: Compile passive read-only GPI0 observer (unpublished candidate)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project G614JVRGPI0Observer.xcodeproj -target G614JVRGPI0Observer -configuration Debug \
            -sdk macosx ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/GPIOObserver" build
          BUNDLE="$GITHUB_WORKSPACE/build/GPIOObserver/G614JVRGPI0Observer.kext"
          plutil -lint "$BUNDLE/Contents/Info.plist"
          lipo "$BUNDLE/Contents/MacOS/G614JVRGPI0Observer" -verify_arch x86_64
          python3 Tools/Build/verify_kext_vtables.py "$BUNDLE/Contents/MacOS/G614JVRGPI0Observer"
          if nm "$BUNDLE/Contents/MacOS/G614JVRGPI0Observer" | grep -Ei 'OSWrite|writel|gpioWrite|setDirection|configureGPIO|CirrusAudioFixup'; then
            echo 'Unexpected write or amplifier symbol; fail closed.'; exit 1
          fi
          echo 'PASSIVE ONLY: no runtime trigger, access contract or artifact publication.'
      - name: Enforce probe-only build gate
        run: |
          echo 'FAIL CLOSED: dedicated target is an unreviewed candidate; lifecycle and write audit remain incomplete.'
          echo 'No kext artifact will be published or deployed.'
          exit 1
      # Intentionally no kext artifact: delete this guard only after implementing
      # and auditing the real dedicated probe target and its complete call graph.
